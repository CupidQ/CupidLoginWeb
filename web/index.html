<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CupidQ · 登录与注册</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="vendor/canvas-nest-2.0.1.umd.js" defer></script>
  <script src="cursor.js" defer></script>
</head>
<body>
  <div class="auth-side">
    <header class="header">
      <div class="brand"><img src="assets/avatar.webp" alt="" width="40" height="40"><div>CupidQ<span>账号中心</span></div></div>
      <button id="theme-toggle" type="button" aria-label="切换深色主题" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs><mask id="moon-mask"><rect width="24" height="24" fill="white" stroke="none"/><circle class="moon-cutout" cx="12" cy="12" r="6" fill="black" stroke="none"/></mask></defs>
          <circle class="sun-disc" cx="12" cy="12" r="5.5" mask="url(#moon-mask)"/>
          <path class="sun-rays" d="M12 1v2m0 18v2M1 12h2m18 0h2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
    </header>
    <main>
      <section class="card" aria-label="账号登录与注册">
        <div id="login-panel">
          <h1>欢迎回来</h1>
          <p class="subtitle">使用CupidQ账号继续</p>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="login-username">账号</label>
              <input id="login-username" name="username" placeholder="请输入账号" autocomplete="username" maxlength="40" required aria-describedby="login-username-error">
              <span class="error" id="login-username-error"></span>
            </div>
            <div class="field">
              <label for="login-password">密码</label>
              <div class="password-wrap">
                <input id="login-password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required aria-describedby="login-password-error">
                <button class="eye" type="button" aria-label="显示密码" aria-pressed="false" aria-controls="login-password">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="closed-eye" d="M3 9c4 7 14 7 18 0M5 12l-2 3m5-1-1 3m5-2v3m4-4 1 3m2-5 2 3"/>
                  </svg>
                </button>
              </div>
              <span class="error" id="login-password-error"></span>
            </div>
            <button class="primary" type="submit">登录</button>
          </form>
          <p class="switch">还没有账号？ <button type="button" data-mode="register">立即注册</button></p>
        </div>

        <div id="register-panel" hidden>
          <h1>创建账号</h1>
          <p class="subtitle">从这里，开始你的第一步。</p>
          <form id="register-form" novalidate>
            <div class="field">
              <label for="register-username">账号</label>
              <input id="register-username" name="username" placeholder="请输入账号" autocomplete="username" maxlength="40" required aria-describedby="register-username-error">
              <span class="error" id="register-username-error"></span>
            </div>
            <div class="field">
              <label for="register-password">密码</label>
              <div class="password-wrap">
                <input id="register-password" name="password" type="password" placeholder="请输入密码" autocomplete="new-password" required aria-describedby="register-password-error">
                <button class="eye" type="button" aria-label="显示密码" aria-pressed="false" aria-controls="register-password">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="closed-eye" d="M3 9c4 7 14 7 18 0M5 12l-2 3m5-1-1 3m5-2v3m4-4 1 3m2-5 2 3"/>
                  </svg>
                </button>
              </div>
              <span class="error" id="register-password-error"></span>
            </div>
            <div class="field">
              <label for="register-confirm">确认密码</label>
              <input id="register-confirm" name="confirm" type="password" placeholder="请再次输入密码" autocomplete="new-password" required aria-describedby="register-confirm-error">
              <span class="error" id="register-confirm-error"></span>
            </div>
            <button class="primary" type="submit">注册</button>
          </form>
          <p class="switch">已经有账号？ <button type="button" data-mode="login">立即登录</button></p>
        </div>
      </section>
    </main>
    <footer>© CupidQ <span>布道自由。</span></footer>
  </div>
</body>
</html>
